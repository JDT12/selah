# Selah Desktop (12.0, Electron, desktop-app/): builds the Windows installer when a release tag (vX.Y.Z or
# vX.Y.Z-beta.N) is pushed and uploads it, with latest.yml for the updater, to a DRAFT GitHub release for that tag.
# Publish the draft after trying the installer: only then does electron-updater offer it to installed apps (betas only
# to beta installs). Uses the workflow's own GITHUB_TOKEN; no other secrets until the installer is signed.
name: Selah Desktop

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0

      - name: Build the page
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The draft is made here, before electron-builder: left to it, its parallel uploads can each make a draft for
      # the same tag (the installer in one, the blockmap in another). A beta's draft is a pre-release already.
      - name: Make the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          PRE=(); [[ "$TAG" == *-* ]] && PRE=(--prerelease)
          gh release create "$TAG" --draft "${PRE[@]}" --title "${TAG#v}" --notes "Selah ${TAG#v}. What changed: CHANGELOG.md and docs/."

      - name: Build and upload the installer
        working-directory: desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/dist.mjs --publish always
