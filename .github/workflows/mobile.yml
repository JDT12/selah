# Selah for Android (mobile-app/, 13.0): run from the Actions tab to get a signed APK as a build artifact.
# iOS builds run on the iMac for now. Repository secrets:
#   ANDROID_KEYSTORE_BASE64   the signing keystore (PKCS12), base64
#   ANDROID_KEYSTORE_PASSWORD its password
name: Selah Mobile (Android)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync the Capacitor project
        working-directory: mobile-app
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Build the signed APK
        working-directory: mobile-app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SELAH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export SELAH_KEYSTORE="$RUNNER_TEMP/selah-android.p12"
          echo "$KEYSTORE_B64" | base64 -d > "$SELAH_KEYSTORE"
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: selah-android
          path: mobile-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
